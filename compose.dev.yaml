x-project-runtime: &project-runtime
    image: linkpilot-dev
    working_dir: /var/www
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    volumes:
        - .:/var/www

services:
    app:
        image: linkpilot-dev
        command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload

    queue:
        image: linkpilot-dev

    vite:
        <<: *project-runtime
        ports:
            - '5173:5173'
        environment:
            VITE_HMR_HOST: '${VITE_HMR_HOST:-localhost}'
            VITE_HMR_PORT: '${VITE_HMR_PORT:-5173}'
        command: npm run dev -- --host 0.0.0.0 --port 5173 --strictPort

    scheduler:
        <<: *project-runtime
        command: php artisan schedule:work
